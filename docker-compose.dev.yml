# Postgres 16 de DESENVOLVIMENTO do TIMControl (porta host 5441). Não usa nem toca outros containers.
# Subir: pnpm db:up   |   Apagar tudo: pnpm db:reset
services:
  postgres:
    image: postgres:16
    container_name: timcontrol-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres_dev_only}
      POSTGRES_DB: timcontrol
      OWNER_DB_PASSWORD: ${OWNER_DB_PASSWORD:-timcontrol_owner_dev}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-timcontrol_app_dev}
    command: ["postgres", "-c", "shared_buffers=48MB", "-c", "max_connections=30", "-c", "timezone=UTC"]
    mem_limit: 384m
    ports:
      - "${POSTGRES_PORT:-5441}:5432"
    volumes:
      - timcontrol_pgdata:/var/lib/postgresql/data
      - ./docker/init-roles.sh:/docker-entrypoint-initdb.d/00-init-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d timcontrol"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  timcontrol_pgdata:
